<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- PHOTO wordmark -->
  <text
    x="256"
    y="108"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="54"
    font-weight="700"
    letter-spacing="10"
    fill="#1F2937"
  >
    PHOTO
  </text>

  <!-- DSLR camera body -->
  <rect x="148" y="176" width="216" height="148" rx="28" fill="#1F2937"/>
  <rect x="204" y="136" width="104" height="52" rx="12" fill="#1F2937"/>
  <path d="M204 160 H308" stroke="#374151" stroke-width="6" stroke-linecap="round"/>

  <!-- lens -->
  <circle cx="256" cy="252" r="54" fill="#FF5500"/>
  <circle cx="256" cy="252" r="38" fill="#FFFFFF"/>
  <circle cx="256" cy="252" r="24" fill="#FF5500"/>
  <circle cx="256" cy="252" r="10" fill="#1F2937"/>

  <!-- shutter accent -->
  <rect x="318" y="204" width="30" height="18" rx="5" fill="#FF5500"/>

  <!-- grip lines -->
  <path d="M168 220 V280" stroke="#374151" stroke-width="5" stroke-linecap="round"/>
  <path d="M180 220 V280" stroke="#374151" stroke-width="5" stroke-linecap="round"/>

  <!-- OK wordmark -->
  <text
    x="256"
    y="418"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="104"
    font-weight="800"
    letter-spacing="6"
    fill="#FF5500"
  >
    OK
  </text>
</svg>
